<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f5f0"/>
      <stop offset="100%" stop-color="#efece3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/>

  <!-- flowing "typographic" lines of varying width, like justified text blocks -->
  <g opacity="0.9">
    <rect x="200" y="200" width="880" height="14" rx="7" fill="#0B1220" fill-opacity="0.85"/>
    <rect x="200" y="230" width="760" height="10" rx="5" fill="#0B1220" fill-opacity="0.35"/>
    <rect x="200" y="252" width="820" height="10" rx="5" fill="#0B1220" fill-opacity="0.35"/>
    <rect x="200" y="274" width="540" height="10" rx="5" fill="#0F766E" fill-opacity="0.6"/>

    <rect x="200" y="330" width="880" height="14" rx="7" fill="#0B1220" fill-opacity="0.85"/>
    <rect x="200" y="360" width="700" height="10" rx="5" fill="#0B1220" fill-opacity="0.35"/>
    <rect x="200" y="382" width="800" height="10" rx="5" fill="#0B1220" fill-opacity="0.35"/>
    <rect x="200" y="404" width="460" height="10" rx="5" fill="#2563EB" fill-opacity="0.55"/>

    <rect x="200" y="460" width="620" height="14" rx="7" fill="#0B1220" fill-opacity="0.85"/>
    <rect x="200" y="490" width="780" height="10" rx="5" fill="#0B1220" fill-opacity="0.3"/>
  </g>

  <!-- a soundwave motif for voiceover -->
  <g stroke="#0F766E" stroke-width="3" stroke-linecap="round" opacity="0.65">
    <line x1="980" y1="560" x2="980" y2="580"/>
    <line x1="1000" y1="540" x2="1000" y2="600"/>
    <line x1="1020" y1="520" x2="1020" y2="620"/>
    <line x1="1040" y1="548" x2="1040" y2="592"/>
    <line x1="1060" y1="560" x2="1060" y2="580"/>
    <line x1="1080" y1="530" x2="1080" y2="610"/>
    <line x1="1100" y1="550" x2="1100" y2="590"/>
  </g>

  <circle cx="220" cy="150" r="4" fill="#2563EB"/>
  <circle cx="1080" cy="180" r="3" fill="#0F766E"/>
</svg>
